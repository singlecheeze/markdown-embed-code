name: Markdown Embed Code From File
author: "@singlecheeze"

description: >
  Recursively synchronize fenced code blocks in Markdown files
  with local source files throughout the checked-out repository.

outputs:
  changed:
    description: Whether any Markdown files were changed
    value: ${{ steps.embed.outputs.changed }}
  scanned_files:
    description: Number of Markdown files scanned
    value: ${{ steps.embed.outputs.scanned_files }}
  files_with_embeds:
    description: Number of Markdown files containing embed directives
    value: ${{ steps.embed.outputs.files_with_embeds }}
  files_changed:
    description: Number of Markdown files changed
    value: ${{ steps.embed.outputs.files_changed }}
  embedded_blocks:
    description: Number of embedded code blocks processed
    value: ${{ steps.embed.outputs.embedded_blocks }}

runs:
  using: composite
  steps:
    - name: Synchronize embedded code
      id: embed
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/embed.py" "$GITHUB_WORKSPACE"

branding:
  icon: bookmark
  color: green
